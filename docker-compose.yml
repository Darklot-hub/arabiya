services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
  server:
    build: ./server
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/arabiya
      JWT_SECRET: change-me-in-production
      CLIENT_ORIGIN: http://localhost:5173
    depends_on:
      - mongo
    ports:
      - "5000:5000"
  client:
    build: ./client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "5173:80"
volumes:
  mongo_data:
